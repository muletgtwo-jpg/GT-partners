
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden Stainless Steel Charcoal Stove</title>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
  padding: 25px 12px;
  background: #f5f2eb;
  color: #222;
}

.container {
  max-width: 550px;
  margin: auto;
  padding: 20px;
  background: white;
  border-radius: 10px;
}

h1 {
  font-size: 25px;
  margin-bottom: 20px;
}

.product-image {
  display: block;
  max-width: 100%;
  max-height: 280px;
  object-fit: contain;
  margin: 0 auto 20px;
}

.barcode-container {
  width: 100%;
  max-width: 300px;
  margin: 15px auto;
  overflow: hidden;
}

#barcode {
  display: block;
  width: 100%;
  height: auto;
}

button {
  padding: 10px 14px;
  margin: 8px 4px;
  border: none;
  border-radius: 5px;
  background: #b58a36;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>
<div class="container">

  <h1>Golden Stainless Steel Charcoal Stove</h1>

  <img
    class="product-image"
    src="charcole%20stove.jpg"
    alt="Golden Stainless Steel Charcoal Stove"
    onerror="this.style.display='none';"
  >

  <div class="barcode-container">
    <svg id="barcode"
         role="img"
         aria-label="Code 128 product barcode">
    </svg>
  </div>

  <button onclick="downloadBarcode('png')">
    Download PNG
  </button>

  <button onclick="downloadBarcode('svg')">
    Download SVG
  </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<script>
const barcode = document.getElementById("barcode");

// Short product ID keeps the barcode compact.
JsBarcode(barcode, "GT001", {
  format: "CODE128",
  width: 2,
  height: 65,
  displayValue: true,
  fontSize: 12,
  margin: 8,
  background: "#ffffff",
  lineColor: "#000000"
});

function downloadBarcode(format) {
  const svg = document.getElementById("barcode");
  const clone = svg.cloneNode(true);
  clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");

  const source = new XMLSerializer().serializeToString(clone);
  const blob = new Blob([source], {
    type: "image/svg+xml;charset=utf-8"
  });
  const url = URL.createObjectURL(blob);

  if (format === "svg") {
    saveFile(url, "golden_stainless_steel_charcoal_stove.svg");
    return;
  }

  const image = new Image();

  image.onload = function() {
    const canvas = document.createElement("canvas");
    canvas.width = image.naturalWidth * 3;
    canvas.height = image.naturalHeight * 3;

    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(image, 0, 0, canvas.width, canvas.height);

    URL.revokeObjectURL(url);

    canvas.toBlob(function(png) {
      if (!png) return;
      const pngUrl = URL.createObjectURL(png);
      saveFile(
        pngUrl,
        "golden_stainless_steel_charcoal_stove.png"
      );
    }, "image/png");
  };

  image.onerror = function() {
    URL.revokeObjectURL(url);
    alert("Could not export the barcode. Please try SVG.");
  };

  image.src = url;
}

function saveFile(url, filename) {
  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(function() {
    URL.revokeObjectURL(url);
  }, 1500);
}
</script>

</body>
</html>
